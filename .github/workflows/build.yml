name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found. Installing Android command-line tools..."

            mkdir -p "$ANDROID_HOME/cmdline-tools"

            curl -L \
              -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip

            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline

            mv /tmp/android-cmdline/cmdline-tools/* \
              "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be installed."
            exit 1
          fi

          echo "Found sdkmanager at:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          which sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/myapp/tvhome
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          if [ -f "build.gradle_1.kts" ] && [ ! -f "app/build.gradle.kts" ]; then
            mv build.gradle_1.kts app/build.gradle.kts
          fi

          if [ -f "MainActivity.kt" ]; then
            mv MainActivity.kt app/src/main/java/com/myapp/tvhome/MainActivity.kt
          fi

          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f "ic_launcher.xml" ]; then
            mv ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml
          fi

          if [ -f "banner.xml" ]; then
            mv banner.xml app/src/main/res/drawable/banner.xml
          fi

          if [ -f "strings.xml" ]; then
            mv strings.xml app/src/main/res/values/strings.xml
          fi

          if [ -f "themes.xml" ]; then
            mv themes.xml app/src/main/res/values/themes.xml
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvHome-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
