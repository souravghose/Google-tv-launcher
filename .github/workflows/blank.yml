name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          if [ -f "build.gradle_1.kts" ] && [ ! -f "app/build.gradle.kts" ]; then
            mkdir -p app/src/main/java/com/myapp/tvhome
            mkdir -p app/src/main/res/drawable
            mkdir -p app/src/main/res/values

            mv build.gradle_1.kts app/build.gradle.kts
            mv MainActivity.kt app/src/main/java/com/myapp/tvhome/MainActivity.kt
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml

            mv ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml
            mv banner.xml app/src/main/res/drawable/banner.xml
            mv strings.xml app/src/main/res/values/strings.xml
            mv themes.xml app/src/main/res/values/themes.xml
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvHome-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
